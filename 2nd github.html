<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuantumGrid</title>
  <!-- Optional: tab icon (put logo.png in the same folder) -->
  <link rel="icon" href="logo.png">
</head>
<body>

  <!-- Heading with logo -->
  <h2 align="center">
    QuantumGrid
    <img src="logo.png" alt="QuantumGrid logo" width="30" height="30">
  </h2>

  <hr>
  <hr>

  <!-- Links (stacked, centered) -->
  <p align="center">
    <a href="about.html">Visit Our Website</a><br>
    <a href="https://www.example.com">Visit Our Company</a><br>
    <a href="mailto:info@quantumgrid.com">Contact Us</a>
  </p>

  <!-- Audio -->
  <p align="center">
    <audio controls>
      <source src="audio.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </p>

  <!-- Image 1: Building -->
  <p align="center">
    <img src="building.jpg" alt="QuantumGrid Building" width="300" height="200">
  </p>

  <hr>

  <!-- Image 2: Certificate -->
  <p align="center">
    <img src="certificate.jpg" alt="Certificate" width="300" height="220">
  </p>

  <hr>

  <!-- Video -->
  <p align="center">
    <video width="300" height="170" controls poster="video-poster.jpg">
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </p>

  <hr>

  <!-- Animated GIF -->
  <p align="center">
    <img src="spin.gif" alt="Spin animation" width="300" height="200">
  </p>

  <hr>

</body>
</html>
